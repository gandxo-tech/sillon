<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Soil AI Crew — NASA Space Apps 2026">
  <defs>
    <path id="arcHaut" d="M 26,100 A 74,74 0 0 1 174,100" />
    <path id="arcBas" d="M 34,102 A 66,66 0 0 0 166,102" />
    <linearGradient id="feuille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd36a" />
      <stop offset="1" stop-color="#3f7f4a" />
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb2e5" />
      <stop offset="1" stop-color="#5fd0c8" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="#12263f" />
  <circle cx="100" cy="100" r="98" fill="none" stroke="#ffffff" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#5b86b8" stroke-width="1.2" opacity="0.7" />

  <text font-family="'Public Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="2.2">
    <textPath href="#arcHaut" startOffset="50%" text-anchor="middle">SOIL AI CREW</textPath>
  </text>
  <text font-family="'Public Sans', system-ui, sans-serif" font-size="8.4" font-weight="600" fill="#a8c4e0" letter-spacing="3.4">
    <textPath href="#arcHaut" startOffset="50%" dy="17" text-anchor="middle">NASA SPACE APPS</textPath>
  </text>

  <!-- orbite et satellite -->
  <path d="M 40,128 A 62,44 0 0 1 150,74" fill="none" stroke="url(#orbit)" stroke-width="4" stroke-linecap="round" opacity="0.95" />
  <g transform="translate(142,74) rotate(-16)">
    <rect x="-7" y="-4.5" width="14" height="9" rx="1.6" fill="#eaf1f8" />
    <rect x="-16" y="-3" width="7" height="6" rx="1" fill="#8fd0f0" />
    <rect x="9" y="-3" width="7" height="6" rx="1" fill="#8fd0f0" />
  </g>

  <!-- feuille -->
  <path d="M 62,132 C 40,120 42,96 66,84 C 78,100 78,120 62,132 Z" fill="url(#feuille)" />
  <path d="M 62,132 C 58,116 60,98 66,86" fill="none" stroke="#2c5f38" stroke-width="1.4" opacity="0.7" />

  <!-- épi de blé -->
  <path d="M 96,150 L 96,104" stroke="#cfe3a8" stroke-width="2.4" stroke-linecap="round" />
  <g fill="#b9d98a">
    <ellipse cx="90" cy="112" rx="4.4" ry="7" transform="rotate(-28 90 112)" />
    <ellipse cx="102" cy="112" rx="4.4" ry="7" transform="rotate(28 102 112)" />
    <ellipse cx="90" cy="124" rx="4.4" ry="7" transform="rotate(-24 90 124)" />
    <ellipse cx="102" cy="124" rx="4.4" ry="7" transform="rotate(24 102 124)" />
    <ellipse cx="91" cy="136" rx="4.2" ry="6.6" transform="rotate(-20 91 136)" />
    <ellipse cx="101" cy="136" rx="4.2" ry="6.6" transform="rotate(20 101 136)" />
    <ellipse cx="96" cy="100" rx="4" ry="7" />
  </g>

  <!-- réseau d'observation -->
  <g stroke="#7fc6a8" stroke-width="1.2" opacity="0.9">
    <path d="M 118,118 L 132,104 L 146,116 L 132,130 Z" fill="none" />
    <path d="M 132,104 L 132,130" fill="none" />
  </g>
  <g fill="#8fd3b4">
    <circle cx="118" cy="118" r="3.4" />
    <circle cx="132" cy="104" r="3.4" />
    <circle cx="146" cy="116" r="3.4" />
    <circle cx="132" cy="130" r="3.4" />
  </g>
  <circle cx="139" cy="98" r="2.6" fill="#e8b464" />
  <circle cx="112" cy="134" r="2.6" fill="#e8b464" />

  <!-- circuit de données -->
  <g stroke="#5c9ad0" stroke-width="1.6" fill="none" opacity="0.95">
    <path d="M 66,150 h 12 v -8 h 10" />
    <path d="M 70,160 h 18 v -6" />
    <circle cx="66" cy="150" r="2.2" fill="#7fb2e5" stroke="none" />
  </g>

  <!-- 2026 et drapeau du Burkina Faso -->
  <path id="banniere" d="M 44,176 H 156" stroke="#3d5d84" stroke-width="0.8" fill="none" />
  <text x="88" y="186" font-family="'Public Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#dbe5f0" text-anchor="middle" letter-spacing="2">2026</text>
  <g transform="translate(102,178)">
    <rect x="0" y="0" width="14" height="4.6" fill="#ef3340" />
    <rect x="0" y="4.6" width="14" height="4.6" fill="#009e49" />
    <path d="M 7,6.2 l 0.9,1.8 2,-0.3 -1.5,1.4 0.4,2 -1.8,-1 -1.8,1 0.4,-2 -1.5,-1.4 2,0.3 Z" fill="#fcd116" />
  </g>
  <text x="100" y="196" font-family="'Public Sans', system-ui, sans-serif" font-size="5.6" font-weight="600" fill="#8aa6c4" text-anchor="middle" letter-spacing="1.6">SILLON</text>
</svg>
